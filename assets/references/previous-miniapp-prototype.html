<style>
:root{--bg:#081b15;--gold:#d8c18a;--cream:#f5efdf;--muted:#b9c6b9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% -5%,#1a3a2c 0%,#081b15 66%)}
.topbar{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 17px;padding-top:env(safe-area-inset-top);border-bottom:1px solid #ffffff16;background:#071912d9;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:750;letter-spacing:.16em}
.brandmark{width:32px;height:32px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:#ead8aa;font:20px Georgia,serif;box-shadow:0 0 18px #d8c18a24}
.brand small{display:block;font-size:8px;color:var(--muted);letter-spacing:.25em;font-weight:400;margin-top:2px}
.eyebrow{font-size:9px;color:var(--gold);letter-spacing:.19em}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;padding:9px;touch-action:none}
.frame{position:absolute;inset:9px;border:1px solid #d8c18a65;border-radius:16px;overflow:hidden;background:#102a20;box-shadow:0 18px 48px #0008,inset 0 0 0 1px #ffffff10}
#map{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none;transform-origin:center center}
.controls{position:absolute;right:19px;bottom:19px;display:flex;flex-direction:column;gap:7px;z-index:2}
.controls button{width:39px;height:39px;border:1px solid #d8c18a75;border-radius:12px;background:#081b15e8;color:#f5e8c9;font-size:20px;backdrop-filter:blur(8px);box-shadow:0 4px 12px #0005;cursor:pointer}
.hint{position:absolute;left:50%;bottom:21px;transform:translateX(-50%);white-space:nowrap;background:#081b15d9;border:1px solid #ffffff25;border-radius:99px;padding:8px 12px;color:#d8dfd3;font-size:9px;letter-spacing:.04em;pointer-events:none;z-index:2}
@media(min-width:650px){.frame{width:min(calc(100% - 24px),600px);left:50%;right:auto;transform:translateX(-50%)}}
</style></head><body>

<div class="hint">Збільшення — двома пальцями або кнопками</div><div class="controls"><button id="zoomIn" aria-label="Збільшити">+</button><button id="zoomOut" aria-label="Зменшити">−</button><button id="reset" aria-label="Скинути масштаб">↺</button></div></main></div>
<script>
(()=>{const stage=document.getElementById('stage'),img=document.getElementById('map');let scale=1,dx=0,dy=0,points=new Map(),drag=null,pinch=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),draw=()=>img.style.transform=`translate(${dx}px,${dy}px) scale(${scale})`,zoom=v=>{scale=clamp(v,1,4);draw()};
document.getElementById('zoomIn').onclick=()=>zoom(scale*1.25);document.getElementById('zoomOut').onclick=()=>zoom(scale/1.25);document.getElementById('reset').onclick=()=>{scale=1;dx=0;dy=0;draw()};
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(scale*(e.deltaY<0?1.12:1/1.12))},{passive:false});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.controls'))return;stage.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===1)drag={x:e.clientX,y:e.clientY,dx,dy};if(points.size===2){const a=[...points.values()];pinch={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale}}});
stage.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===1&&drag){dx=drag.dx+e.clientX-drag.x;dy=drag.dy+e.clientY-drag.y;draw()}if(points.size===2&&pinch){const a=[...points.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom(pinch.scale*d/Math.max(1,pinch.distance))}});
const end=e=>{points.delete(e.pointerId);if(points.size<2)pinch=null;if(!points.size)drag=null};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}})();
</script><script src="https://telegram.org/js/telegram-web-app.js"></script></body></html>
