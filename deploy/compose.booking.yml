name: uwelnes
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: /etc/uwelnes/postgres.env
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=25"]
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["booking-data:/var/lib/postgresql/data"]
    networks: [booking-access]
    mem_limit: 160m
    shm_size: 32m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uwelnes"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  booking-access:
    driver: bridge
volumes:
  booking-data:
