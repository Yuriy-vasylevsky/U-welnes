[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "u-wellness-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "aiogram>=3.20,<4", "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "tzdata>=2025"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
include = ["wellness*"]
[tool.setuptools.package-data]
wellness = ["data/*.json", "media/*.png"]
[tool.pytest.ini_options]
testpaths = ["tests"]
